<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-label="ezur: browser tools, no dead ends">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#040907"/>
      <stop offset=".55" stop-color="#07120c"/>
      <stop offset="1" stop-color="#0b1d14"/>
    </linearGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f4fff9"/>
      <stop offset=".6" stop-color="#b9ffda"/>
      <stop offset="1" stop-color="#35ea86"/>
    </linearGradient>
    <radialGradient id="halo" cx=".82" cy=".38" r=".55">
      <stop offset="0" stop-color="#35ea86" stop-opacity=".23"/>
      <stop offset="1" stop-color="#35ea86" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#9bf7c5" stroke-opacity=".055" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1280" height="360" fill="url(#bg)"/>
  <rect width="1280" height="360" fill="url(#grid)"/>
  <rect width="1280" height="360" fill="url(#halo)"/>

  <path d="M34 74V34h42" fill="none" stroke="#35ea86" stroke-opacity=".5" stroke-width="2"/>
  <path d="M1246 286v40h-42" fill="none" stroke="#35ea86" stroke-opacity=".35" stroke-width="2"/>

  <circle cx="46" cy="64" r="4" fill="#35ea86"/>
  <text x="60" y="69" fill="#8df6bd" font-family="'Courier New', monospace" font-size="13" letter-spacing="4">EZUR / GITHUB</text>
  <text x="1240" y="69" text-anchor="end" fill="#6c957f" font-family="'Courier New', monospace" font-size="12" letter-spacing="3">ONE ACCOUNT / NO FAST MODE</text>

  <text x="48" y="224" fill="url(#ink)" font-family="'Arial Black', Arial, sans-serif" font-weight="900" font-size="170" letter-spacing="-9">EZUR</text>
  <text x="54" y="264" fill="#dfffee" font-family="'Courier New', monospace" font-size="17" letter-spacing="4">BROWSER TOOLS / NO DEAD ENDS.</text>

  <g transform="translate(985 66)">
    <circle cx="120" cy="120" r="116" fill="none" stroke="#35ea86" stroke-opacity=".12" stroke-width="2"/>
    <circle cx="120" cy="120" r="88" fill="none" stroke="#35ea86" stroke-opacity=".22" stroke-width="1.5"/>
    <circle cx="120" cy="120" r="60" fill="#06100b" stroke="#35ea86" stroke-opacity=".4" stroke-width="1.5"/>
    <path d="M120 0v14M120 226v14M0 120h14M226 120h14" stroke="#9bf7c5" stroke-opacity=".45" stroke-width="2"/>
    <path d="M39 39l10 10M201 201l10 10M39 201l10-10M201 39l10 10" stroke="#9bf7c5" stroke-opacity=".3" stroke-width="2"/>
    <path d="M72 76 91 170 120 108 149 170 168 76" fill="none" stroke="url(#ink)" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
    <circle cx="120" cy="120" r="4" fill="#f2fff9"/>
  </g>

  <path d="M48 310H760" stroke="#35ea86" stroke-opacity=".22"/>
  <text x="48" y="338" fill="#6c957f" font-family="'Courier New', monospace" font-size="11" letter-spacing="3">JAVASCRIPT / NODE / TAMPERMONKEY</text>
  <text x="1232" y="338" text-anchor="end" fill="#6c957f" font-family="'Courier New', monospace" font-size="11" letter-spacing="3">SMALL TOOLS / LONG RUNS</text>
</svg>
